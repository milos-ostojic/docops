[project]
name = "docops"
version = "0.1.0"
description = "AI assistant for business documents"
readme = "README.md"
authors = [
    { name = "Milos Ostojic", email = "milosostoja95@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.165.0",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]